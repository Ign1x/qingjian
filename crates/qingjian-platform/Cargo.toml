[package]
name = "qingjian-platform"
description = "平台相关但不依赖系统 API 的部分：配置文件读写"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
qingjian-core.workspace = true
qingjian-dictionary.workspace = true
qingjian-predict.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true

# Linux 的 socket 路径按 euid 隔离私有临时目录、前端客户端核对对端 uid（SO_PEERCRED）；
# keysym → Unicode 给 Linux 前端共用的键表
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
xkeysym.workspace = true

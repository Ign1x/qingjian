[package]
name = "qingjian-linux-wayland"
description = "Linux Wayland 原生前端：自己当 input-method-v2 客户端，候选窗用青简渲染器自绘，引擎在 Server 进程"
version = "0.1.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qingjian-linux-wayland"
path = "src/main.rs"

# 与 IBus 前端一样不扛 Engine：词库、排序、学习全在 Server 那一侧，这里只做协议翻译与画候选窗。
# 连 Server 的客户端、键表与帧换算走 qingjian-platform（protocol::linux 与 display），与 IBus 前端共用。
[dependencies]
qingjian-platform = { workspace = true, features = ["render"] }
qingjian-render.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[lints]
workspace = true

# 只有测试用：协议帧里的候选就是 `qingjian_core::Candidate`，造测试数据绕不开 core；
# Link 的测试对着走真 socket 的假 Server，按原始 JSON 收发（与共用客户端的测试一样）
[dev-dependencies]
qingjian-core.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
memmap2.workspace = true
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
xkbcommon-dl = "0.4.2"
# 外观跟随系统：后台线程上一个单线程 tokio 运行时跑 zbus，读 xdg-desktop-portal 的 Settings、跟着 SettingChanged。
# 不开 zbus 的 blocking-api：它的阻塞调用另起一个按核数开线程的运行时
futures-util.workspace = true
tokio.workspace = true
zbus.workspace = true

# 黑盒测试（tests/blackbox）：假合成器用 wayland-server 搭，协议对象要 server 那一侧；假 Server 收发 JSON
[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-protocols = { version = "0.32.13", features = ["server", "staging"] }
wayland-protocols-misc = { version = "0.3.12", features = ["server"] }
wayland-server = "0.31.14"
